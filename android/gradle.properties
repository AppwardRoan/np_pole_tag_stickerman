org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# R8 off. Flutter's own Gradle plugin (FlutterPlugin.kt) forces minify +
# resource shrinking on for every release build; this is the switch it reads.
# R8 deletes code nothing appears to call, and ML Kit's text reader loads its
# pieces by name at runtime -- so R8 strips them and the scan silently returns
# nothing in a release APK, while working fine over `flutter run`, which never
# runs R8. Delete this line to put R8 back, once proper -keep rules exist.
shrink=false
